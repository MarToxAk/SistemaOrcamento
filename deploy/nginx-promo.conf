# Server block dedicado ao microsite de sorteio (D-03).
#
# Arquivo NOVO e separado de deploy/nginx.conf: aquele arquivo tem um unico
# server block catch-all (`server_name _`) para o app de orcamento. Um
# server_name nomeado (abaixo) tem precedencia sobre o default `_` no
# roteamento do nginx, entao os dois coexistem sem editar deploy/nginx.conf.
#
# As diretivas de TLS (listen 443 ssl, ssl_certificate, ssl_certificate_key)
# sao inseridas automaticamente pelo certbot:
#   certbot --nginx -d promocao.bomcustoilhabela.com.br
# Rode esse comando na VPS depois de publicar o registro DNS do host.

server {
    listen 80;
    server_name promocao.bomcustoilhabela.com.br;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 8k casa com o limite duro de 4096 bytes de corpo aceito pelo
        # servidor promo (server/index.js) — margem para headers.
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
