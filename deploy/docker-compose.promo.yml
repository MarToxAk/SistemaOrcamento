# Stack standalone do microsite de sorteio Dia das Criancas (D-03).
#
# Arquivo NOVO e independente de docker-compose.vps.yml / docker-compose.box.vps.yml:
# o sorteio NAO entra na rede app_net do stack de orcamento. Isolamento total
# garante que uma falha do microsite promocional nunca derruba o faturamento.
#
# Variaveis vem de substituicao ${VAR} (nao de env_file): quando este compose
# e deployado via Portainer/git, o diretorio clonado nao contem nenhum arquivo
# .env versionado (deploy/promo.env nunca e commitado, ver .gitignore) — um
# env_file: ./promo.env quebraria com "file not found" nesse fluxo. Preencha
# as variaveis abaixo na secao "Environment variables" do stack do Portainer
# (ou exporte-as no shell antes de um `docker compose up` manual na VPS). Ver
# promo/.env.example para a lista completa e o significado de cada uma.
# PROMO_ATHOS_BASE_URL pode apontar tanto para o alias de host abaixo
# (host.docker.internal) quanto para a URL publica do backend, o que for
# alcancavel da VPS.
#
# Proxy reverso: esta VPS usa Nginx Proxy Manager (container), NAO nginx de
# arquivo de config (deploy/nginx-promo.conf fica como referencia p/ quem usa
# nginx tradicional, mas nao se aplica aqui). Por isso o servico entra tambem
# na rede externa do NPM (nginx-proxy-manager_default) — sem isso o container
# do NPM nao alcanca promo-sorteio pelo nome, so pelo IP do HOST, que o bind
# em 127.0.0.1:3100 (loopback do host) bloqueia de proposito. No Proxy Host do
# NPM, configure: Forward Hostname/IP = promo-sorteio, Forward Port = 3100,
# SSL via Let's Encrypt do proprio NPM.
#
# Subir/atualizar: docker compose -f deploy/docker-compose.promo.yml up -d --build

services:
  promo:
    build: ../promo
    container_name: promo-sorteio
    restart: always
    networks:
      - default
      - npm_proxy
    environment:
      TRUST_PROXY: "1"
      PROMO_ADMIN_TOKEN: ${PROMO_ADMIN_TOKEN}
      PROMO_ATHOS_BASE_URL: ${PROMO_ATHOS_BASE_URL}
      PROMO_ATHOS_API_TOKEN: ${PROMO_ATHOS_API_TOKEN}
      PROMO_BACKEND_INTERNAL_API_KEY: ${PROMO_BACKEND_INTERNAL_API_KEY}
      PROMO_ATHOS_TIMEOUT_MS: ${PROMO_ATHOS_TIMEOUT_MS}
      PROMO_WHATSAPP_HOST: ${PROMO_WHATSAPP_HOST}
      PROMO_WHATSAPP_INSTANCE: ${PROMO_WHATSAPP_INSTANCE}
      PROMO_WHATSAPP_API_KEY: ${PROMO_WHATSAPP_API_KEY}
      PROMO_WHATSAPP_TIMEOUT_MS: ${PROMO_WHATSAPP_TIMEOUT_MS}
    ports:
      # Bind apenas em loopback — quem expoe na internet e o nginx, com TLS.
      # Publicar em 0.0.0.0 entregaria a API em HTTP puro.
      - "127.0.0.1:3100:3100"
    extra_hosts:
      # Permite ao container alcancar portas publicadas no host da VPS (ex: o
      # backend de orcamento em host.docker.internal:4001) sem entrar na rede
      # app_net do stack de orcamento — o isolamento de D-03 (task anterior)
      # continua valendo, este alias so da acesso ao host, nao a rede do stack.
      - "host.docker.internal:host-gateway"
    volumes:
      - promo_data:/data

volumes:
  promo_data:

networks:
  npm_proxy:
    external: true
    name: nginx-proxy-manager_default
